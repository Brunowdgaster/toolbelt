name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # As ferramentas sao testadas nas DUAS direcoes: tem de achar o que devem
  # achar (fixture sujo) e ficar caladas no que esta certo (fixture limpo).
  #
  # Nada aqui depende de tempo de maquina, so de saida exata -- por isso roda
  # inteiro no runner, diferente dos jobs de benchmark dos outros projetos.
  ferramentas:
    runs-on: ubuntu-latest
    name: ferramentas (Perl, AWK, Lua, Raku, Tcl)
    steps:
      - uses: actions/checkout@v5

      - name: toolchains
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # perl e gawk ja vem na imagem; lua5.4 nao.
          # ocaml entra porque o roteiro do Expect dirige o toplevel dele.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            lua5.4 rakudo expect ocaml groovy
          perl -e 'print "perl $]\n"'
          awk 'BEGIN { print "awk", PROCINFO["version"] }'
          lua5.4 -e 'print(_VERSION)'
          raku -e 'say "raku ", $*RAKU.compiler.version'
          echo "expect $(expect -c 'puts [exp_version]')"
          ocaml -version

      # O p01 e um repositorio separado, e a grammar em Raku e verificada
      # CONTRA o desmontador em C dele. Sem ele a verificacao cruzada seria
      # impossivel, e o verifica.sh diz isso em vez de pular em silencio.
      - name: clonar e compilar a VM do p01
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/Brunowdgaster/metal-vm /tmp/p01
          (cd /tmp/p01 && bash build.sh)
          /tmp/p01/build-switch/fvm version

      - name: suite (sem nix)
        env:
          P01: /tmp/p01
        # O bloco do nix e separado abaixo, com a instalacao propria dele.
        #
        # `par` tambem fica fora: a comparacao Bash x PowerShell exige pwsh, e
        # o runner nao tem. Ela roda no shell do Nix, onde o powershell vem
        # declarado -- e e la que foi verificada que as duas concordam.
        run: bash verifica.sh perl awk lua raku tcl groovy

  # O Nix num job proprio: ele precisa de instalacao dedicada (nao esta na
  # imagem do runner) e as verificacoes dele nao dependem do p01.
  #
  # O que roda aqui e a AVALIACAO dos quatro devShells, que prova que todo
  # nome de pacote existe no nixpkgs travado. A CONSTRUCAO nao roda: sao de
  # 576 MiB a 1,1 GiB por shell, e num runner compartilhado isso e minutos de
  # download para verificar o que a avaliacao ja garante.
  nix:
    runs-on: ubuntu-latest
    name: ambientes declarados (Nix)
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: versao
        run: nix --version

      - name: 4 verificacoes do flake
        run: bash verifica.sh nix

      # O lint rodando sobre os READMEs deste repositorio: ele tem de passar
      # nos proprios textos. Orcamento 0 -- se um numero sem dispersao entrar
      # aqui, o CI acusa.
      - name: o lint passa no proprio README
        run: perl perl/lint_medicoes.pl README.md
